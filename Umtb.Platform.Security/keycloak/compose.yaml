services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm", "--http-port=18080"]
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro
    environment:
      KC_HOSTNAME: http://127.0.0.1:18080
    # No persistent volume: the fixture starts with the same assignments on each run.
